<!doctype html>
<html lang="en">
  <body style="margin:0;padding:28px 16px;background:#f8f5ef;color:#291f1e;font-family:Arial,sans-serif">
    <div style="max-width:440px;margin:auto;padding:30px;background:#ffffff;border:1px solid #e3dad2;border-radius:14px">
      <p style="margin:0 0 26px;font-size:19px;font-weight:bold;color:#72152a">StudySync</p>
      <h1 style="margin:0 0 14px;font-size:25px">Verify your email</h1>
      <p style="line-height:1.6">Enter this one-time code on the StudySync verification screen.</p>
      <p style="margin:20px 0;padding:16px;background:#f8efea;color:#72152a;font-size:32px;font-weight:bold;letter-spacing:4px;text-align:center">{{ .Token }}</p>
      <p style="line-height:1.6">Closed the tab? <a href="{{ .SiteURL }}/verify-email" style="color:#72152a">Open StudySync</a> and enter your email address and code.</p>
      <p style="margin:22px 0 0;color:#695d59;font-size:13px">If you didn’t request this code, you can ignore this email.</p>
    </div>
  </body>
</html>
